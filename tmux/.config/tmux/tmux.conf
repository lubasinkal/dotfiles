# =============================================================================
# tmux.conf — ~/.config/tmux/tmux.conf  (tmux 3.7)
# =============================================================================

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"      # truecolor support
set -sg escape-time 0                          # instant Esc for vim/nvim
set -g history-limit 50000
set -g mouse on
set -g focus-events on
set -g set-titles on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g status-interval 5
set -g extended-keys on
set -g extended-keys-format csi-u
set -g mode-keys vi

# ---------------------------------------------------------------------------
# Theme — cyberdream
# ---------------------------------------------------------------------------
set -g status-style "bg=#16181a,fg=#ffffff"
set -g status-left-length 50
set -g status-right-length 60
set -g status-left "#[fg=#16181a,bg=#5ea1ff,bold]  #{?client_prefix,󰠠 , }#S  "
set -g status-right "#[fg=#1e2124]#[fg=#7b8496,bg=#1e2124]󰒋 #h #[fg=#5ea1ff,bg=#1e2124]#[fg=#16181a,bg=#5ea1ff,bold] %H:%M #[fg=#5ea1ff]"
set -g window-status-format " #[fg=#7b8496]#{?#{==:#{pane_current_command},ssh},󰣀 , } #I #W#{?window_zoomed_flag, 󰃉 , }"
set -g window-status-current-format "#[#{?window_zoomed_flag,fg=#f1ff5e,fg=#5ea1ff}]#[bg=#1e2124] #[fg=#5eff6c]▍#[fg=#ffffff,bold]#{?#{==:#{pane_current_command},ssh},󰣀 , } #I #W#{?window_zoomed_flag, 󰃉 , }"
set -g window-status-separator ""
set -g window-status-style "bg=#16181a,fg=#7b8496"
set -g window-status-current-style "bg=#16181a,fg=#ffffff"
set -g window-status-activity-style "fg=#f1ff5e,bold"
set -g window-status-bell-style "fg=#ff6e5e,bold"
set -g pane-border-style "fg=#3c4048"
set -g pane-active-border-style "fg=#5ea1ff"
set -g popup-border-style "fg=#5ea1ff"
set -g popup-border-lines rounded
set -g message-style "bg=#1e2124,fg=#ffffff"
set -g mode-style "bg=#5ea1ff,fg=#16181a"
set -g copy-mode-match-style "fg=#16181a,bg=#f1ff5e"
set -g copy-mode-current-match-style "fg=#16181a,bg=#5eff6c"

# ---------------------------------------------------------------------------
# Keys — navigation & splits
# ---------------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "󱦟 Reloaded"

# Vim-style pane movement (prefix + h/j/k/l)
bind -N "Select pane left"  h select-pane -L
bind -N "Select pane down"  j select-pane -D
bind -N "Select pane up"    k select-pane -U
bind -N "Select pane right" l select-pane -R

# Alt+hjkl resize (no prefix)
bind -n M-h resize-pane -L 2
bind -n M-j resize-pane -D 2
bind -n M-k resize-pane -U 2
bind -n M-l resize-pane -R 2

# Splits open in the current directory
bind "|" split-window -h -c "#{pane_current_path}"
bind "-" split-window -v -c "#{pane_current_path}"

# Windows
bind -N "Previous window" b previous-window
bind -n M-H previous-window
bind -n M-L next-window
bind c new-window -c "#{pane_current_path}"            # default c, keeps cwd
bind , command-prompt -I "#W" { rename-window "%%" }   # prefill current name
bind . command-prompt -I "#S" { rename-session "%%" }  # replaces move-window prompt

# (prefix+1..9 use tmux defaults, which respect base-index 1)

# ---------------------------------------------------------------------------
# Keys — copy mode
# ---------------------------------------------------------------------------
# v, C-v, C-u, C-d already do the right thing in copy-mode-vi by default.
bind Enter copy-mode                                  # prefix+Enter
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# ---------------------------------------------------------------------------
# Floating popup (prefix+t) — persistent shell at current dir, exit to close
# ---------------------------------------------------------------------------
bind -N "Toggle floating shell" t display-popup -d '#{pane_current_path}' -w 80% -h 80%

# ---------------------------------------------------------------------------
# Menus
# ---------------------------------------------------------------------------
# Edit dotfiles (prefix+D)
bind D display-menu -T "#[align=centre] Dotfiles" -x C -y C \
  "tmux"        t { display-popup -E -d ~/.config/tmux -w 85% -h 80% nvim ~/.config/tmux/tmux.conf } \
  "nvim"        n { display-popup -E -d ~/.config/nvim -w 85% -h 80% nvim ~/.config/nvim/init.lua } \
  "zsh"         z { display-popup -E -d ~ -w 85% -h 80% nvim ~/.zshrc } \
  "" \
  "Exit"        q ""

# Session management (prefix+e)
bind e display-menu -T "#[align=centre] Sessions" \
  "New"       n { command-prompt -I "session" "new-session -s '%%' -c #{pane_current_path}" } \
  "Rename"    r { command-prompt -I "#S" { rename-session "%%" } } \
  "Kill"      k { confirm-before -p "kill session #S?" kill-session } \
  "" \
  "Detach"    d detach-client \
  "Previous"  p { switch-client -p } \
  "Next"      x { switch-client -n } \
  "List"      l { choose-session }

# ---------------------------------------------------------------------------
# Tool popups (only bound if the binary exists)
# ---------------------------------------------------------------------------
if-shell "command -v lazygit" {
  bind -N "Lazygit popup" g display-popup -E -w 85% -h 80% lazygit
}

# File manager: yazi, falling back to lf
if-shell "command -v yazi" {
  bind -N "File manager popup" F display-popup -E -w 80% -h 80% yazi
} {
  if-shell "command -v lf" {
    bind -N "File manager popup" F display-popup -E -w 80% -h 80% lf
  }
}

if-shell "command -v fzf" {
  # Session picker (prefix+s)
  bind -N "Switch session (fzf)" s display-popup -E -w 70% -h 50% "tmux list-sessions -F '#{session_name}' | fzf --reverse --header='Switch Session' | xargs -I{} tmux switch-client -t {}"
  # Window picker (prefix+w)
  bind -N "Switch window (fzf)" w display-popup -E -w 70% -h 40% "tmux list-windows -a -F '#{session_name}:#{window_index} #{window_name}' | fzf --reverse --header='Switch Window' | awk '{print \$1}' | xargs -I{} tmux switch-client -t {}"
  # Man page explorer (prefix+m)
  bind -N "Man page explorer (fzf)" m display-popup -E -w 85% -h 80% "bash -l -c 'compgen -c | sort -u | fzf | xargs -r man'"
}

# ---------------------------------------------------------------------------
# Mouse — right-click menus (stay open on release)
# ---------------------------------------------------------------------------
bind -T root MouseDown3Pane display-menu -O -T "#[align=centre]#{pane_index} (#{pane_id})" -t = -x M -y M \
  "Horizontal Split"  h { split-window -h -c "#{pane_current_path}" } \
  "Vertical Split"    v { split-window -v -c "#{pane_current_path}" } \
  "" \
  "Swap Up"           u { swap-pane -U } \
  "Swap Down"          d { swap-pane -D } \
  "" \
  "#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z }

bind -T root MouseDown3Status display-menu -O -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W \
  "New Window"  w { new-window -c "#{pane_current_path}" } \
  "Rename"      n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } \
  "" \
  "Swap Left"   l { swap-window -d -t :-1 } \
  "Swap Right"  r { swap-window -d -t :+1 }

bind -T root MouseDown3StatusLeft display-menu -O -T "#[align=centre]#{session_name}" -t = -x M -y W \
  "Next Session"     n { switch-client -n } \
  "Previous Session" p { switch-client -p } \
  "" \
  "Rename Session"   r { command-prompt -I "#S" { rename-session "%%" } } \
  "New Session"      s { new-session }

# ---------------------------------------------------------------------------
# Plugins (TPM)
# ---------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'

run '~/.config/tmux/plugins/tpm/tpm'
