# =============================================================================
# tmux.conf — ~/.config/tmux/tmux.conf
# =============================================================================

# -------------------------------------------------------------------
# General
# -------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g escape-time 0
set -g history-limit 50000
set -g mouse on
set -g focus-events on
set -g set-titles on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g status-interval 5
set -g extended-keys on
set -g extended-keys-format csi-u
# -------------------------------------------------------------------
# Theme — cyberdream
# -------------------------------------------------------------------
set -g status-style "bg=#16181a,fg=#ffffff"
set -g status-left "#[fg=#16181a,bg=#5ea1ff,bold]  #{?client_prefix,󰠠 , }#S  "
set -g status-right ""
set -g window-status-format " #[fg=#3c4048]│#[fg=#7b8496]#{?#{==:#{pane_current_command},ssh},󰣀 , } #I #W#{?window_zoomed_flag, 󰃉 , }"
set -g window-status-current-format " #[fg=#5eff6c]│#[fg=#ffffff,bold]#{?#{==:#{pane_current_command},ssh},󰣀 , } #I #W#{?window_zoomed_flag, 󰃉 , }"
set -g window-status-separator ""
set -g window-status-style "bg=#16181a,fg=#7b8496"
set -g window-status-current-style "bg=#16181a,fg=#ffffff"
set -g window-status-activity-style "fg=#f1ff5e,bold"
set -g window-status-bell-style "fg=#ff6e5e,bold"
set -g pane-border-style "fg=#3c4048"
set -g pane-active-border-style "fg=#5ea1ff"
set -g message-style "bg=#1e2124,fg=#ffffff"
set -g mode-style "bg=#5ea1ff,fg=#16181a"

# -------------------------------------------------------------------
# Key Bindings
# -------------------------------------------------------------------

bind r source-file ~/.config/tmux/tmux.conf \; display-message "󱦟 Reloaded"

# Vim-style navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-h resize-pane -L 2
bind -n M-j resize-pane -D 2
bind -n M-k resize-pane -U 2
bind -n M-l resize-pane -R 2

# Splits (open in same directory)
bind "|" split-window -h -c "#{pane_current_path}"
bind "-" split-window -v -c "#{pane_current_path}"

# Quick window selection
bind -r 1 select-window -t 1
bind -r 2 select-window -t 2
bind -r 3 select-window -t 3
bind -r 4 select-window -t 4
bind -r 5 select-window -t 5
bind -r 6 select-window -t 6
bind -r 7 select-window -t 7
bind -r 8 select-window -t 8
bind -r 9 select-window -t 9

# Copy mode (vi keys)
set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind Enter copy-mode
bind -T copy-mode-vi C-u send-keys -X halfpage-up
bind -T copy-mode-vi C-d send-keys -X halfpage-down

# -------------------------------------------------------------------
# Floating Popups
# -------------------------------------------------------------------

# Toggle floating terminal (persistent shell in a hidden __float__ session)
# NB: no -c flag — #{pane_current_path} doesn't expand inside nested if-shell
# strings (tmux errors "-c expects an argument"). The session's cwd is set once
# at creation from tmux's default.
# Close via display-popup -C (closes any popup on the client); detach-client
# would not close the popup.
bind t if-shell -F '#{==:#{session_name},__float__}' \
  'display-popup -C' \
  'if-shell "tmux has-session -t __float__" "display-popup -w 80% -h 80% -s bg=#16181a -t __float__:" "new-session -d -s __float__; display-popup -w 80% -h 80% -s bg=#16181a -t __float__:"'

# -------------------------------------------------------------------
# Menus
# -------------------------------------------------------------------
# Session management
bind e display-menu -T "#[align=centre] Sessions" \
  "New"       n { command-prompt -I "session" "new-session -s '%%' -c #{pane_current_path}" } \
  "Rename"    r { command-prompt -I "#S" { rename-session "%%" } } \
  "Kill"      k { confirm-before -p "kill session #S?" kill-session } \
  "" \
  "Previous"  p { switch-client -p } \
  "Next"      x { switch-client -n } \
  "List"      l { choose-session }

# Lazygit
if-shell "which lazygit" "bind g display-popup -E -w 85% -h 80% -s bg=#16181a lazygit"

# Session picker (fzf)
if-shell "which fzf" "bind s display-popup -E -w 70% -h 50% -s bg=#16181a \"tmux list-sessions -F '#{session_name}' | fzf --reverse --header='Switch Session' | xargs -I{} tmux switch-client -t {}\""

# Window picker (fzf)
if-shell "which fzf" "bind w display-popup -E -w 70% -h 40% -s bg=#16181a \"tmux list-windows -a -F '#{session_name}:#{window_index} #{window_name}' | fzf --reverse --header='Switch Window' | awk '{print \$1}' | xargs -I{} tmux switch-client -t {}\""

# File manager (yazi → lf fallback)
if-shell "which yazi" "bind F display-popup -E -w 80% -h 80% -s bg=#16181a yazi" "if-shell \"which lf\" \"bind F display-popup -E -w 80% -h 80% -s bg=#16181a lf\""

# Man page explorer
if-shell "which fzf" "bind m display-popup -E -w 85% -h 80% -s bg=#16181a \"bash -l -c 'compgen -c | sort -u | fzf | xargs -r man'\""


# -------------------------------------------------------------------
# Misc
# -------------------------------------------------------------------
bind x kill-pane
bind z resize-pane -Z
# bind s choose-tree -Zs  # replaced by fzf session picker above
bind c new-window -c "#{pane_current_path}"
bind , command-prompt -I "#W" { rename-window "%%" }
bind . command-prompt -I "#S" { rename-session "%%" }

# Right-click stays open on release
bind -T root MouseDown3Pane display-menu -O -T "#[align=centre]#{pane_index} (#{pane_id})" -t = -x M -y M \
  "Horizontal Split"  h { split-window -h -c "#{pane_current_path}" } \
  "Vertical Split"    v { split-window -v -c "#{pane_current_path}" } \
  "" \
  "Swap Up"           u { swap-pane -U } \
  "Swap Down"          d { swap-pane -D } \
  "" \
  "Zoom"               z { resize-pane -Z } \
  "Unzoom"             Z { resize-pane -Z }

bind -T root MouseDown3Status display-menu -O -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W \
  "New Window"  w { new-window -c "#{pane_current_path}" } \
  "Rename"      n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } \
  "" \
  "Swap Left"   l { swap-window -d -t :-1 } \
  "Swap Right"  r { swap-window -d -t :+1 }

bind -T root MouseDown3StatusLeft display-menu -O -T "#[align=centre]#{session_name}" -t = -x M -y W \
  "Next Session"     n { switch-client -n } \
  "Previous Session" p { switch-client -p } \
  "" \
  "Rename Session"   r { command-prompt -I "#S" { rename-session "%%" } } \
  "New Session"      s { new-session }

# -------------------------------------------------------------------
# Plugins (TPM)
# -------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

run '~/.config/tmux/plugins/tpm/tpm'
