config_version = 14

[backdrop]
enabled = true

[bar.default]
background_opacity = 1.0
border_width = 0.0
capsule = false
center = [ "clock", "media", "bar", "control-center", "switch" ]
concave_edge_corners = false
end = [ "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "session" ]
hover_highlight = false
margin_edge = 0
margin_ends = 0
padding = 10
radius = 0
radius_bottom_left = 0
radius_bottom_right = 0
radius_top_left = 0
radius_top_right = 0
reserve_space = false
shadow = false
smart_auto_hide = true
start = [ "launcher", "wallpaper", "workspaces", "status" ]
thickness = 32
widget_spacing = 4

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = false

    [desktop_widgets.widget]

[dock]
auto_hide = true
enabled = true
reserve_space = false

[location]
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000002", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 8
    major_interval = 4
    visible = false

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 683.0
    cy = 520.63671875
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.20000000000000001
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 128.0
    box_width = 400.0
    cx = 683.0
    cy = 210.1875
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background_opacity = 0.42999999999999999
        clock_style = "digital"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 0.0
    box_width = 0.0
    cx = 683.0
    cy = 384.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "button"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = true
        glyph = "heart"
        variant = "default"

[nightlight]
enabled = true

[osd]
radius = 0

[plugins]
auto_update = "all"
enabled = [ "noctalia/timer", "davemhammer/tailscale", "kavya-nama/wallpaper-switcher" ]

[shell]
button_borders = false
card_borders = false
corner_radius_scale = 0.0
input_borders = false
password_style = "random"
polkit_agent = true
popup_borders = false
popup_shadows = false

    [shell.animation]
    enabled = true
    speed = 1.2

    [shell.panel]
    control_center_placement = "close_to_bar_button"
    wallpaper_placement = "attached_to_bar"

    [shell.shadow]
    enabled = false

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "kcolorscheme", "niri", "qt" ]
    community_ids = [ "ungoogled-chromium", "zen-browser", "vicinae", "fastfetch", "fzf", "tmux" ]

[wallpaper]
transition_on_startup = true

    [wallpaper.automation]
    recursive = false

    [wallpaper.default]
    path = "/home/lubasi/Pictures/wp8308010-adventure-time-aesthetic-wallpapers.jpg"

    [wallpaper.last]
    path = "/home/lubasi/Pictures/wp8308010-adventure-time-aesthetic-wallpapers.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/lubasi/Pictures/wp8308010-adventure-time-aesthetic-wallpapers.jpg"

[widget.bar]
type = "noctalia/timer:bar"

[widget.media]
album_art_only = true

[widget.network]
show_label = false

[widget.status]
type = "davemhammer/tailscale:status"

[widget.switch]
type = "kavya-nama/wallpaper-switcher:switch"