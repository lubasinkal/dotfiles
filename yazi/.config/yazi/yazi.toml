# https://yazi-rs.github.io/docs/configuration/yazi
# Sections follow Yazi 25.3+ naming: [mgr] (formerly [manager]).

[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_dir_first = true
show_hidden    = false

[preview]
max_width     = 600
max_height    = 900
image_filter  = "box"
image_quality = 75

[opener]
edit = [
	{ run = 'nvim %s', desc = "Edit with nvim", block = true, for = "unix" },
]
